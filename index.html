<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ink Notes">
<meta name="theme-color" content="#f2f1ec">
<title>Ink Notes</title>
<style>
  :root{
    color-scheme: light;
    --chrome: #f2f1ec;
    --chrome-2: #ffffff;
    --ink: #22252b;
    --ink-soft: #6a7079;
    --line: #dcdcd4;
    --line-strong: #c7c7bd;
    --accent: #3f6bd6;
    --accent-ink: #ffffff;
    --danger: #c5362f;
    --field: #e9e8e1;
    --paper: #fdfdfb;     /* canvas paper — kept light so ink is always visible */
    --rule: #cfe0ef;      /* ruled/dot guide colour on paper */
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --chrome: #1b1d22;
      --chrome-2: #22252c;
      --ink: #e8eaf0;
      --ink-soft: #9aa2b1;
      --line: #2c2f38;
      --line-strong: #3b4049;
      --accent: #6f8cf0;
      --accent-ink: #0d0f14;
      --field: #2a2e36;
      /* paper + rule stay light on purpose */
    }
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; height:100%; width:100%; position:fixed; overflow:hidden;
    overscroll-behavior:none; background:var(--chrome); color:var(--ink);
    font-family:var(--sans); -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  #app{ display:flex; flex-direction:column; height:100%; width:100%; }

  /* ---- top toolbar ---- */
  .toolbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 10px; padding-top:calc(8px + env(safe-area-inset-top));
    background:var(--chrome-2); border-bottom:1px solid var(--line);
  }
  .group{ display:flex; align-items:center; gap:6px; }
  .sep{ width:1px; align-self:stretch; background:var(--line); margin:2px 4px; }
  .grow{ flex:1 1 auto; }

  button{
    font-family:var(--sans); font-size:14px; color:var(--ink);
    background:var(--field); border:1px solid transparent; border-radius:10px;
    min-height:40px; min-width:40px; padding:0 12px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  button:active{ transform:translateY(1px); }
  button.icon{ padding:0; width:42px; }
  button.tool.active{ background:var(--accent); color:var(--accent-ink); }
  button.ghost{ background:transparent; }
  button.ghost:active{ background:var(--field); }
  button:disabled{ opacity:.4; }
  button.danger:active{ color:var(--danger); }
  .title-btn{ font-weight:650; max-width:38vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; background:transparent; }

  .swatch{ width:30px; height:30px; min-width:30px; min-height:30px; border-radius:50%; border:2px solid var(--line-strong); padding:0; }
  .swatch.active{ border-color:var(--ink); box-shadow:0 0 0 2px var(--chrome-2), 0 0 0 4px var(--accent); }
  .wbtn{ width:40px; }
  .wdot{ background:currentColor; border-radius:50%; display:block; }
  .wbtn.active{ background:var(--accent); color:var(--accent-ink); }

  .toggle{ font-size:13px; color:var(--ink-soft); display:inline-flex; align-items:center; gap:6px; padding:0 8px; min-height:40px; }
  .toggle input{ width:18px; height:18px; accent-color:var(--accent); }
  select{
    font-family:var(--sans); font-size:13px; color:var(--ink); background:var(--field);
    border:1px solid var(--line-strong); border-radius:8px; min-height:40px; padding:0 8px;
  }

  /* ---- canvas stage ---- */
  .stage{ position:relative; flex:1 1 auto; min-height:0; background:var(--paper); }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }
  .hint{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#b9b9ad; font-size:17px; pointer-events:none; text-align:center; padding:24px;
  }

  /* ---- bottom page bar ---- */
  .pagebar{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:8px 10px; padding-bottom:calc(8px + env(safe-area-inset-bottom));
    background:var(--chrome-2); border-top:1px solid var(--line);
  }
  .page-ind{ font-size:13px; color:var(--ink-soft); min-width:92px; text-align:center; }

  /* ---- notes panel ---- */
  .scrim{ position:fixed; inset:0; background:rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .15s; z-index:10; }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .panel{
    position:fixed; top:0; left:0; bottom:0; width:min(320px,82vw); z-index:11;
    background:var(--chrome-2); border-right:1px solid var(--line);
    transform:translateX(-102%); transition:transform .18s ease; display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  .panel.open{ transform:translateX(0); }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 14px 8px; }
  .panel-head h2{ margin:0; font-size:16px; }
  .note-list{ flex:1; overflow:auto; padding:6px; }
  .note-item{
    display:flex; align-items:center; gap:8px; padding:12px; border-radius:10px; cursor:pointer;
  }
  .note-item.active{ background:var(--field); }
  .note-item .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .note-item .meta{ font-size:12px; color:var(--ink-soft); }
  .note-item .del{ background:transparent; color:var(--ink-soft); min-width:34px; width:34px; }
  .panel-foot{ padding:10px 14px; border-top:1px solid var(--line); }
  .panel-foot button{ width:100%; background:var(--accent); color:var(--accent-ink); }
</style>
</head>
<body>
<div id="app">
  <div class="toolbar">
    <div class="group">
      <button class="icon ghost" id="menuBtn" title="Notes" aria-label="Notes">☰</button>
      <button class="title-btn" id="titleBtn" title="Rename note">My Notes</button>
    </div>
    <div class="sep"></div>
    <div class="group" id="tools">
      <button class="tool active" data-tool="pen" id="penBtn">Pen</button>
      <button class="tool" data-tool="highlighter" id="hlBtn">Marker</button>
      <button class="tool" data-tool="eraser" id="erBtn">Eraser</button>
    </div>
    <div class="sep"></div>
    <div class="group" id="colors"></div>
    <div class="sep"></div>
    <div class="group" id="widths">
      <button class="wbtn" data-w="fine" title="Fine"><span class="wdot" style="width:4px;height:4px"></span></button>
      <button class="wbtn active" data-w="medium" title="Medium"><span class="wdot" style="width:7px;height:7px"></span></button>
      <button class="wbtn" data-w="thick" title="Thick"><span class="wdot" style="width:11px;height:11px"></span></button>
    </div>
    <div class="grow"></div>
    <div class="group">
      <button class="icon ghost" id="undoBtn" title="Undo" disabled>↶</button>
      <button class="icon ghost" id="redoBtn" title="Redo" disabled>↷</button>
      <select id="paperSel" title="Paper style">
        <option value="ruled">Ruled</option>
        <option value="dots">Dots</option>
        <option value="plain">Plain</option>
      </select>
      <label class="toggle"><input type="checkbox" id="penOnly" checked>Pencil only</label>
      <button class="ghost" id="exportBtn" title="Export page as image">Export</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="hint" id="hint">Write here with your Apple Pencil</div>
  </div>

  <div class="pagebar">
    <button class="ghost" id="prevBtn" title="Previous page">‹ Prev</button>
    <span class="page-ind" id="pageInd">Page 1 / 1</span>
    <button class="ghost" id="nextBtn" title="Next page">Next ›</button>
    <div class="sep"></div>
    <button class="ghost" id="addPageBtn" title="Add a page">+ Page</button>
    <button class="ghost danger" id="clearBtn" title="Clear this page">Clear</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-label="Notes">
  <div class="panel-head"><h2>Notes</h2><button class="ghost icon" id="panelClose">✕</button></div>
  <div class="note-list" id="noteList"></div>
  <div class="panel-foot"><button id="newNoteBtn">+ New note</button></div>
</aside>

<script>
(function(){
  "use strict";

  // ---------- storage (IndexedDB; survives app restarts on the device) ----------
  var DB="inknotes", STORE="kv", KEY="notebook";
  function idb(){ return new Promise(function(res,rej){ var r=indexedDB.open(DB,1);
    r.onupgradeneeded=function(){ r.result.createObjectStore(STORE); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
  function idbGet(k){ return idb().then(function(db){ return new Promise(function(res,rej){
    var t=db.transaction(STORE,"readonly"), q=t.objectStore(STORE).get(k);
    q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ rej(q.error); }; }); }); }
  function idbSet(k,v){ return idb().then(function(db){ return new Promise(function(res,rej){
    var t=db.transaction(STORE,"readwrite"); t.objectStore(STORE).put(v,k);
    t.oncomplete=function(){ res(); }; t.onerror=function(){ rej(t.error); }; }); }); }

  // ---------- model ----------
  // notebook = { notes:[ {id,title,paper,pageIndex,pages:[ {strokes:[ {tool,color,width,points:[{x,y,p}]} ]} ]} ], activeId }
  var COLORS = ["#1a1a1a","#1b56c4","#c62828","#1b7a3d","#f2b705"];
  var WIDTHS = { fine:2, medium:3.6, thick:6.5 };
  var HL_WIDTH = 20, ERASE_R = 13;

  var nb = null;
  var tool = "pen", color = COLORS[0], widthKey = "medium", penOnly = true;
  var undoStack = [], redoStack = [];     // per current page, in-memory only
  var saveTimer = null;

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function freshNote(title){ return { id:uid(), title:title||"Untitled", paper:"ruled", pageIndex:0, pages:[{strokes:[]}] }; }
  function activeNote(){ return nb.notes.filter(function(n){ return n.id===nb.activeId; })[0] || nb.notes[0]; }
  function activePage(){ var n=activeNote(); return n.pages[n.pageIndex]; }
  function baseWidth(){ return WIDTHS[widthKey]; }

  function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(function(){ idbSet(KEY, nb).catch(function(){}); }, 400); }

  // ---------- elements ----------
  var $ = function(id){ return document.getElementById(id); };
  var stage=$("stage"), canvas=$("canvas"), ctx=canvas.getContext("2d"), hint=$("hint");
  var titleBtn=$("titleBtn"), pageInd=$("pageInd"), paperSel=$("paperSel"), penOnlyBox=$("penOnly");
  var undoBtn=$("undoBtn"), redoBtn=$("redoBtn");
  var panel=$("panel"), scrim=$("scrim"), noteList=$("noteList");

  // ---------- canvas sizing / rendering ----------
  var dpr = 1;
  function fitCanvas(){
    dpr = Math.min(window.devicePixelRatio||1, 3);
    var w = stage.clientWidth, h = stage.clientHeight;
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    renderAll();
  }
  function logicalSize(){ return { w: canvas.width/dpr, h: canvas.height/dpr }; }

  function paintPaper(){
    var s = logicalSize(), n = activeNote();
    ctx.clearRect(0,0,s.w,s.h);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--paper").trim() || "#fdfdfb";
    ctx.fillRect(0,0,s.w,s.h);
    if(n.paper==="plain") return;
    var guide = getComputedStyle(document.documentElement).getPropertyValue("--rule").trim() || "#cfe0ef";
    if(n.paper==="ruled"){
      ctx.strokeStyle=guide; ctx.lineWidth=1;
      for(var y=36; y<s.h; y+=32){ ctx.beginPath(); ctx.moveTo(0,y+0.5); ctx.lineTo(s.w,y+0.5); ctx.stroke(); }
    } else { // dots
      ctx.fillStyle=guide;
      for(var gy=24; gy<s.h; gy+=24){ for(var gx=24; gx<s.w; gx+=24){ ctx.beginPath(); ctx.arc(gx,gy,1,0,Math.PI*2); ctx.fill(); } }
    }
  }

  function strokeWidthAt(st,p){ if(st.tool==="highlighter") return st.width; return st.width * (0.35 + 0.65*(p||0.5)); }

  function drawSeg(st,a,b){
    ctx.strokeStyle = st.color;
    ctx.globalAlpha = st.tool==="highlighter" ? 0.32 : 1;
    ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.lineWidth = strokeWidthAt(st, (a.p+b.p)/2);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function drawStroke(st){
    var pts=st.points; if(!pts.length) return;
    if(pts.length===1){
      ctx.globalAlpha = st.tool==="highlighter" ? 0.32 : 1;
      ctx.fillStyle=st.color; ctx.beginPath();
      ctx.arc(pts[0].x, pts[0].y, strokeWidthAt(st,pts[0].p)/2, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha=1; return;
    }
    for(var i=1;i<pts.length;i++) drawSeg(st, pts[i-1], pts[i]);
  }
  function renderAll(){
    paintPaper();
    var strokes = activePage().strokes;
    for(var i=0;i<strokes.length;i++) drawStroke(strokes[i]);
    updateHint();
  }
  function updateHint(){ hint.style.display = activePage().strokes.length===0 ? "flex" : "none"; }

  // ---------- drawing ----------
  var drawing=false, cur=null, last=null, erasing=false, erased=null;
  function pos(e){ var r=canvas.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top, p:(e.pressure>0?e.pressure:0.5) }; }
  function allowed(e){ if(e.pointerType==="pen"||e.pointerType==="mouse") return true; return !penOnly; }

  function hitErase(pt){
    var strokes=activePage().strokes, hitSet=[];
    for(var i=0;i<strokes.length;i++){ var ps=strokes[i].points;
      for(var j=0;j<ps.length;j++){ var dx=ps[j].x-pt.x, dy=ps[j].y-pt.y;
        if(dx*dx+dy*dy <= ERASE_R*ERASE_R){ hitSet.push(strokes[i]); break; } } }
    if(hitSet.length){
      activePage().strokes = strokes.filter(function(s){ return hitSet.indexOf(s)<0; });
      for(var k=0;k<hitSet.length;k++) erased.push(hitSet[k]);
      renderAll();
    }
  }

  canvas.addEventListener("pointerdown", function(e){
    if(!e.isPrimary || !allowed(e)) return;
    e.preventDefault(); canvas.setPointerCapture(e.pointerId);
    if(tool==="eraser"){ erasing=true; erased=[]; hitErase(pos(e)); return; }
    drawing=true; last=pos(e);
    cur={ tool:tool, color:color, width: tool==="highlighter"?HL_WIDTH:baseWidth(), points:[last] };
    // render the initial dot immediately
    drawStroke(cur); updateHint();
  }, {passive:false});

  canvas.addEventListener("pointermove", function(e){
    if(erasing){ e.preventDefault();
      var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for(var i=0;i<evs.length;i++) hitErase(pos(evs[i])); return; }
    if(!drawing) return; e.preventDefault();
    var pts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for(var m=0;m<pts.length;m++){
      var p=pos(pts[m]); var dx=p.x-last.x, dy=p.y-last.y;
      if(dx*dx+dy*dy < 0.4) continue;              // skip near-duplicate points
      cur.points.push(p); drawSeg(cur,last,p); last=p;
    }
  }, {passive:false});

  function endStroke(e){
    if(erasing){ erasing=false;
      if(erased && erased.length){ undoStack.push({t:"erase", items:erased}); redoStack=[]; refreshUndo(); save(); }
      erased=null; return; }
    if(!drawing) return; drawing=false;
    if(cur && cur.points.length){ activePage().strokes.push(cur); undoStack.push({t:"add", s:cur}); redoStack=[]; refreshUndo(); save(); }
    cur=null; last=null;
  }
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);

  // ---------- undo / redo ----------
  function refreshUndo(){ undoBtn.disabled = undoStack.length===0; redoBtn.disabled = redoStack.length===0; }
  function doUndo(){ var op=undoStack.pop(); if(!op) return;
    if(op.t==="add"){ var a=activePage().strokes; var i=a.indexOf(op.s); if(i>=0) a.splice(i,1); }
    else { for(var k=0;k<op.items.length;k++) activePage().strokes.push(op.items[k]); }
    redoStack.push(op); refreshUndo(); renderAll(); save();
  }
  function doRedo(){ var op=redoStack.pop(); if(!op) return;
    if(op.t==="add"){ activePage().strokes.push(op.s); }
    else { var a=activePage().strokes; for(var k=0;k<op.items.length;k++){ var i=a.indexOf(op.items[k]); if(i>=0) a.splice(i,1); } }
    undoStack.push(op); refreshUndo(); renderAll(); save();
  }

  // ---------- pages ----------
  function refreshPageInd(){ var n=activeNote(); pageInd.textContent = "Page "+(n.pageIndex+1)+" / "+n.pages.length; }
  function gotoPage(i){ var n=activeNote(); if(i<0||i>=n.pages.length) return; n.pageIndex=i; undoStack=[]; redoStack=[]; refreshUndo(); refreshPageInd(); renderAll(); save(); }
  $("prevBtn").onclick=function(){ gotoPage(activeNote().pageIndex-1); };
  $("nextBtn").onclick=function(){ gotoPage(activeNote().pageIndex+1); };
  $("addPageBtn").onclick=function(){ var n=activeNote(); n.pages.push({strokes:[]}); gotoPage(n.pages.length-1); };
  $("clearBtn").onclick=function(){ if(!activePage().strokes.length) return;
    if(!confirm("Clear everything on this page?")) return;
    undoStack.push({t:"erase", items: activePage().strokes.slice()}); redoStack=[]; refreshUndo();
    activePage().strokes=[]; renderAll(); save(); };

  // ---------- notes panel ----------
  function openPanel(){ scrim.classList.add("open"); panel.classList.add("open"); renderNoteList(); }
  function closePanel(){ scrim.classList.remove("open"); panel.classList.remove("open"); }
  $("menuBtn").onclick=openPanel; $("panelClose").onclick=closePanel; scrim.onclick=closePanel;

  function renderNoteList(){
    noteList.innerHTML="";
    nb.notes.forEach(function(n){
      var row=document.createElement("div"); row.className="note-item"+(n.id===nb.activeId?" active":"");
      var pages=n.pages.length, strokes=n.pages.reduce(function(a,p){ return a+p.strokes.length; },0);
      var nm=document.createElement("div"); nm.className="nm";
      nm.innerHTML = "<div>"+escapeHtml(n.title)+"</div><div class='meta'>"+pages+(pages>1?" pages":" page")+" · "+strokes+" strokes</div>";
      row.appendChild(nm);
      var del=document.createElement("button"); del.className="del"; del.textContent="🗑";
      del.onclick=function(ev){ ev.stopPropagation(); deleteNote(n.id); };
      row.appendChild(del);
      row.onclick=function(){ switchNote(n.id); closePanel(); };
      noteList.appendChild(row);
    });
  }
  function switchNote(id){ nb.activeId=id; undoStack=[]; redoStack=[]; refreshUndo(); syncNoteUI(); fitCanvas(); save(); }
  function deleteNote(id){
    var n = nb.notes.filter(function(x){return x.id===id;})[0]; if(!n) return;
    if(!confirm("Delete \""+n.title+"\" and all its pages?")) return;
    nb.notes = nb.notes.filter(function(x){ return x.id!==id; });
    if(!nb.notes.length) nb.notes.push(freshNote("My Notes"));
    if(nb.activeId===id) nb.activeId=nb.notes[0].id;
    syncNoteUI(); renderNoteList(); fitCanvas(); save();
  }
  $("newNoteBtn").onclick=function(){ var n=freshNote("Note "+(nb.notes.length+1)); nb.notes.push(n); switchNote(n.id); closePanel(); };

  titleBtn.onclick=function(){ var n=activeNote(); var t=prompt("Note name:", n.title); if(t==null) return; t=t.trim(); if(!t) return; n.title=t; syncNoteUI(); save(); };

  function syncNoteUI(){ var n=activeNote(); titleBtn.textContent=n.title; paperSel.value=n.paper; refreshPageInd(); }

  // ---------- tool UI ----------
  function buildColors(){
    var box=$("colors");
    COLORS.forEach(function(c){
      var b=document.createElement("button"); b.className="swatch"+(c===color?" active":"");
      b.style.background=c; b.dataset.c=c; b.title=c;
      b.onclick=function(){ color=c; [].forEach.call(box.children,function(x){ x.classList.toggle("active", x.dataset.c===c); }); };
      box.appendChild(b);
    });
  }
  function setTool(t){ tool=t; [].forEach.call(document.querySelectorAll("#tools .tool"), function(b){ b.classList.toggle("active", b.dataset.tool===t); }); }
  document.querySelectorAll("#tools .tool").forEach(function(b){ b.onclick=function(){ setTool(b.dataset.tool); }; });
  document.querySelectorAll("#widths .wbtn").forEach(function(b){ b.onclick=function(){ widthKey=b.dataset.w;
    document.querySelectorAll("#widths .wbtn").forEach(function(x){ x.classList.toggle("active", x.dataset.w===widthKey); }); }; });
  paperSel.onchange=function(){ activeNote().paper=paperSel.value; renderAll(); save(); };
  penOnlyBox.onchange=function(){ penOnly=penOnlyBox.checked; };
  undoBtn.onclick=doUndo; redoBtn.onclick=doRedo;

  // ---------- export ----------
  $("exportBtn").onclick=function(){
    var tmp=document.createElement("canvas"); tmp.width=canvas.width; tmp.height=canvas.height;
    var tctx=tmp.getContext("2d");
    // white paper background for a clean export
    tctx.setTransform(dpr,0,0,dpr,0,0); var s=logicalSize();
    tctx.fillStyle="#ffffff"; tctx.fillRect(0,0,s.w,s.h);
    tctx.drawImage(canvas,0,0,canvas.width,canvas.height,0,0,s.w,s.h);
    tmp.toBlob(function(blob){ if(!blob) return;
      var url=URL.createObjectURL(blob); var a=document.createElement("a");
      var n=activeNote(); a.href=url; a.download=(n.title.replace(/[^\w\- ]+/g,"_"))+"_p"+(n.pageIndex+1)+".png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }, "image/png");
  };

  function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // ---------- keyboard (nice on desktop; harmless on iPad) ----------
  window.addEventListener("keydown", function(e){
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); if(e.shiftKey) doRedo(); else doUndo(); }
  });

  // ---------- resize ----------
  var rt=null;
  window.addEventListener("resize", function(){ clearTimeout(rt); rt=setTimeout(fitCanvas, 120); });
  window.addEventListener("orientationchange", function(){ setTimeout(fitCanvas, 250); });

  // ---------- boot ----------
  idbGet(KEY).then(function(saved){
    if(saved && saved.notes && saved.notes.length){ nb=saved; if(!activeNote()) nb.activeId=nb.notes[0].id; }
    else { nb={ notes:[ freshNote("My Notes") ], activeId:null }; nb.activeId=nb.notes[0].id; }
    // guard against malformed saved data
    nb.notes.forEach(function(n){ if(!n.pages||!n.pages.length) n.pages=[{strokes:[]}]; if(n.pageIndex>=n.pages.length) n.pageIndex=0; if(!n.paper) n.paper="ruled"; });
    buildColors(); setTool("pen"); penOnlyBox.checked=penOnly; syncNoteUI(); fitCanvas(); refreshUndo();
  }).catch(function(){
    nb={ notes:[ freshNote("My Notes") ], activeId:null }; nb.activeId=nb.notes[0].id;
    buildColors(); setTool("pen"); syncNoteUI(); fitCanvas();
  });
})();
</script>
</body>
</html>
